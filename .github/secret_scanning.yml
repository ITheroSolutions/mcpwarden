# Secret scanning exclusions.
#
# test/fixtures/secrets.ts holds synthetic credentials shaped to match each
# vendor's documented format, because the redaction tests are only meaningful
# if they exercise the shapes that actually appear in configuration files. Every
# value there is invented and none was ever valid. See the file header.
#
# Without this exclusion, scanning alerts on that file forever, and an alert
# that is always noise is an alert people stop reading. This file is scoped as
# narrowly as possible: one path, and one that exists to be scanned against.
#
# Nothing else is excluded. If a real credential ever lands anywhere else in
# this repository, scanning should and will catch it.
paths-ignore:
  - 'test/fixtures/secrets.ts'
